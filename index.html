<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Task Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Team Task Board</h1>
        <p>Manage and track team tasks easily.</p>

        <table>
            <thead>
                <tr>
                    <th>Task</th>
                    <th>Assigned To</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Design UI</td>
                    <td>Member 2</td>
                    <td>In Progress</td>
                </tr>
                <tr>
                    <td>Setup Project</td>
                    <td>Member 1</td>
                    <td>Completed</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
